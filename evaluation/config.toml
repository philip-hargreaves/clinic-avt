label = "Gemma-3-27B"
params_b = 27

[summarisation]
# The screening set, in table order, and the subsets the rigor checks use
screening = ["qwen3.5-4b-int4-ov", "qwen3-8b-int4-ov", "qwen3.5-9b-int4-ov", "qwen3.6-27b-int4-ov",
             "qwen3-30b-a3b-int4-ov-official", "qwen3.6-35b-a3b-int4-ov-official", "med42-8b-int4-ov",
             "phi-4-int4-ov", "medgemma-27b-text-it-int4-ov", "granite-4.1-30b-int4-ov",
             "gemma-3-27b-it-int4-ov"]
bootstrap = ["qwen3.5-4b-int4-ov", "qwen3-8b-int4-ov", "qwen3.5-9b-int4-ov", "qwen3.6-27b-int4-ov",
             "qwen3-30b-a3b-int4-ov-official", "qwen3.6-35b-a3b-int4-ov-official"]
reliability = ["qwen3.5-4b-int4-ov", "qwen3.5-9b-int4-ov", "qwen3-30b-a3b-int4-ov-official"]
tiers = { constrained = "qwen3.5-4b-int4", default = "qwen3.5-9b-int4", accuracy = "qwen3.6-35b-a3b-int4" }
comparison = ["qwen3.8-27b-int4-ov", "qwen3.6-27b-int4-ov-intel", "gemma-4-e4b-it-int4-ov",
              "gemma-4-12b-it-qat-int4-ov", "gemma-4-26b-a4b-it-int4-ov", "gemma-4-31b-it-int4-ov"]
transcript_tag = "IMP"             # sealed transcripts the tiers are judged on (import_transcripts.py)

[transcription]
# The Whisper exports compared, folders under asr_models (or app_models for the shipped one)
models = ["whisper-large-v3-turbo-int8-ov", "whisper-large-v3-turbo-int4-ov", "whisper-large-v3-turbo-fp16-ov",
          "whisper-large-v3-int8-ov", "whisper-large-v3-int4-ov", "whisper-large-v3-fp16-ov",
          "distil-large-v3.5-int8-ov", "distil-large-v3.5-fp16-ov",
          "whisper-medium-int8-ov", "whisper-medium-fp16-ov", "whisper-medium-int8-npu-ov",
          "whisper-medium.en-int8-ov", "whisper-medium.en-fp16-ov",
          "whisper-small-int8-ov", "whisper-small-int4-ov", "whisper-small-fp16-ov", "whisper-small-int8-npu-ov"]
