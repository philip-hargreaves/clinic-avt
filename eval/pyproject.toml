# Dependencies of the evaluation suite, one extra per stage. Nothing here is installed as a
# package: the scripts run from the repo (python eval/<stage>/<script>.py).
#
#   py -3.12 -m venv build\eval\venv
#   build\eval\venv\Scripts\python -m pip install -e "eval[asr,summarisation,performance]"
#
# Pins conflict across three groups, so they need their own environments:
#   knowledge                transformers 4 (the lm-eval OpenVINO backend the banked results used)
#   retrieval, translation   transformers 5, OpenVINO 2026.3
#   comet                    transformers 4 and numpy 1 (unbabel-comet), tokenizer conversion too
# torch is the CPU build: add --extra-index-url https://download.pytorch.org/whl/cpu

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicavt-eval"
version = "1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
asr = [
    "openvino-genai==2026.2.1.0",
    "psutil==7.2.2",
    "rapidfuzz==3.14.5",
    "regex",
    "more-itertools",
    "spacy==3.8.14",
    # the clinical lens model: pip install https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_ner_bc5cdr_md-0.5.4.tar.gz
]
summarisation = [
    "openvino-genai==2026.2.1.0",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "bert-score==0.3.13",
    "psutil==7.2.2",
]
performance = [
    "openvino-genai==2026.2.1.0",
    "psutil==7.2.2",
    "matplotlib",
]
knowledge = [
    "lm-eval==0.4.12",
    "optimum==2.2.0",
    "optimum-intel==2.0.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "openvino==2026.2.1",
    "nncf==3.2.0",
]
retrieval = [
    "torch==2.14.0",
    "openvino==2026.3.0",
    "openvino-genai==2026.3.0.0",
    "openvino-tokenizers==2026.3.0.0",
    "optimum==2.3.0",
    "optimum-intel==2.1.0",
    "transformers==5.5.4",
    "sentence-transformers==6.0.1",
    "nncf==3.3.0",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "pypdfium2==5.13.0",
    "scikit-learn==1.9.0",
    "psutil==7.2.2",
    "rank-bm25==0.2.2",
    "hnswlib==0.8.0",
    "usearch==2.26.2",
