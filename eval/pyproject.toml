    "torch==2.14.0",
    "openvino==2026.3.0",
    "openvino-genai==2026.3.0.0",
    "openvino-tokenizers==2026.3.0.0",
    "optimum==2.3.0",
    "optimum-intel==2.1.0",
    "nncf==3.3.0",
    "transformers==5.5.4",
    "sacrebleu==2.6.0",
    "sentencepiece==0.2.2",
    "numpy==2.4.6",
    "psutil==7.2.2",
